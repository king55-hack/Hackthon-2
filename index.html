<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ソナエル" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />

<title>ソナエル SONAERU</title>
<style>
  :root{
    --navy:#0E3A5C; --ink:#22303C; --muted:#5B6C79; --line:#E1E9F0;
    --panel:#F3F7FA; --white:#FFFFFF; --amber:#D9772B; --red:#C24A3A;
    --p1:#1E8A7A; --p2:#D9772B; --p3:#2E7DB8;
    /* dynamic phase tokens */
    --accent:#1C7293; --accent-soft:#E7F1F4; --state-bg:#F3F7FA; --state-band:#1C7293;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:#0a2033; color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100%;
  }
  /* phone frame */
  #app{
    width:100%; max-width:430px; height:100vh; max-height:920px;
    background:var(--state-bg); position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transition:background .35s ease;
  }
  @media (min-width:480px){ #app{ border-radius:34px; height:90vh; } }

  /* header */
  header{
    background:var(--navy); color:#fff; padding:14px 16px 12px;
    transition:background .35s ease;
  }
  #app[data-phase="hassai"] header{ background:#6B1E14; }
  .brandrow{ display:flex; align-items:center; gap:9px; }
  .logo{ width:30px;height:30px;flex:0 0 auto; }
  .brand{ font-weight:800; font-size:19px; letter-spacing:.5px; }
  .brand small{ font-weight:600; font-size:10px; color:#9CC3DC; letter-spacing:3px; display:block; margin-top:-2px;}
  .langpills{ display:flex; gap:5px; margin-left:auto; }
  .langpills button{
    border:1px solid rgba(255,255,255,.35); background:transparent; color:#cfe0ec;
    font-size:11px; font-weight:700; padding:4px 7px; border-radius:20px; cursor:pointer;
    font-family:inherit;
  }
  .langpills button.on{ background:#fff; color:var(--navy); border-color:#fff; }

  /* phase banner */
  .banner{
    padding:12px 16px; display:flex; align-items:center; gap:12px;
    color:#fff; background:var(--state-band); transition:background .35s ease;
  }
  .banner .dot{ width:11px;height:11px;border-radius:50%;background:#fff;flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(255,255,255,.25); }
  #app[data-phase="hassai"] .banner .dot{ animation:pulse 1s infinite; }
  @keyframes pulse{0%{box-shadow:0 0 0 2px rgba(255,255,255,.4)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 2px rgba(255,255,255,0)}}
  .banner b{ font-size:15px; display:block; }
  .banner span{ font-size:11.5px; opacity:.9; }

  /* screen */
  main{ flex:1; overflow-y:auto; padding:14px 15px 20px; -webkit-overflow-scrolling:touch; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:12px; }
  .card.soft{ background:var(--accent-soft); border:none; }
  .card h3{ margin:0 0 4px; font-size:15px; }
  .card .sub{ font-size:12px; color:var(--muted); margin:0; line-height:1.5; }
  .eyebrow{ font-size:10.5px; font-weight:800; letter-spacing:2px; color:var(--accent); text-transform:uppercase; }
  .row{ display:flex; align-items:center; gap:12px; }
  .grow{ flex:1; }
  .icoc{ width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center; }
  .icoc svg{ width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2; }
  .btn{ border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;
    padding:11px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;width:100%; }
  .btn.line{ background:#fff;color:var(--accent);border:1.5px solid var(--accent); }
  .btn.alert{ background:var(--red); }
  .pts{ font-size:34px;font-weight:800;color:var(--accent);line-height:1; }
  .badge{ font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px; }
  .badge.warn{ background:#FBE6DA;color:#B65E18; }
  .badge.ok{ background:#E1F0EC;color:#1E6B5E; }
  .badge.blue{ background:#E4EEF6;color:#2E6FA0; }
  .livedot{ display:inline-block;width:6px;height:6px;border-radius:50%;background:#1E6B5E;margin-right:4px;animation:pulse 1.4s infinite; }
  .listitem{ display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line); }
  .listitem:last-child{ border-bottom:none; }
  .qty{ font-size:12px;color:var(--muted); }
  .judge{ border-radius:16px;padding:18px;color:#fff;text-align:center; }
  .judge b{ font-size:22px;display:block;margin-bottom:4px; }
  .judge span{ font-size:12.5px;opacity:.92; }
  .map{ height:120px;border-radius:12px;background:
      repeating-linear-gradient(45deg,#e8eef3 0 12px,#eef3f7 12px 24px);
      position:relative;overflow:hidden;border:1px solid var(--line);margin-top:10px; }
  .map .pin{ position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;
      background:var(--red);transform:rotate(-45deg);border:2px solid #fff; }
  .map .home{ position:absolute;left:22px;bottom:20px;font-size:10px;font-weight:800;color:var(--navy); }
  .map.tall{ height:170px; }
  .map .leaflet-container{ font-family:inherit; }
  .note{ font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5; }
  .note.err{ color:#B65E18; }
  .linkrow{ display:block;text-decoration:none; }
  .chips{ display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px; }
  .chips button{ white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);
     font-weight:700;font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer;font-family:inherit; }
  .chips button.on{ background:var(--accent);color:#fff;border-color:var(--accent); }
  .check{ display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:13px; }
  .check input{ margin-top:2px;width:18px;height:18px;accent-color:var(--accent); }

  /* bottom nav */
  nav{ display:flex;background:#fff;border-top:1px solid var(--line); }
  nav button{ flex:1;border:none;background:none;padding:9px 2px 10px;cursor:pointer;font-family:inherit;
     color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px; }
  nav button svg{ width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2; }
  nav button.on{ color:var(--accent); }
  #app[data-phase="hassai"] nav button.on{ color:var(--red); }

  /* demo toggle */
  .demo{ position:absolute;left:50%;transform:translateX(-50%);bottom:74px;z-index:20; }
  .demo button{ border:none;border-radius:24px;padding:9px 16px;font-weight:800;font-size:12px;
     color:#fff;background:var(--amber);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;font-family:inherit; }
  #app[data-phase="hassai"] .demo button{ background:#3b4a55; }

  .toast{ position:absolute;left:50%;bottom:130px;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:11px 18px;border-radius:24px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:.3s;z-index:30;white-space:nowrap;max-width:90%; }
  .toast.show{ opacity:1;transform:translateX(-50%) translateY(0); }
</style>
</head>

<div id="app" data-phase="heiji">
  <header>
    <div class="brandrow">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/>
      </svg>
      <div class="brand">ソナエル<small>SONAERU</small></div>
      <div class="langpills" id="langpills">
        <button data-l="ja" class="on">日本</button>
        <button data-l="easy">やさ</button>
        <button data-l="en">EN</button>
        <button data-l="ne">ने</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner">
    <div class="dot"></div>
    <div><b id="bTitle"></b><span id="bSub"></span></div>
  </div>

  <main id="screen"></main>

  <div class="demo"><button id="demoBtn"></button></div>
  <div class="toast" id="toast"></div>

  <nav id="nav">
    <button data-t="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span data-nav="home"></span></button>
    <button data-t="prepare">
      <svg viewBox="0 0 24 24"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
      <span data-nav="prepare"></span></button>
    <button data-t="protect">
      <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg>
      <span data-nav="protect"></span></button>
    <button data-t="recover">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/>
        <line x1="12" y1="3" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="21" y2="12"/></svg>
      <span data-nav="recover"></span></button>
  </nav>
</div>

const TOKYO_FALLBACK = { lat:35.6762, lon:139.6503 };
const S = {
  lang:"ja", phase:"heiji", tab:"home", points:120, recTab:"shelter", quizDone:false,
  checklist:{ act1:false, act2:false, act3:false },
  userToggled:false,
  coords:null, locStatus:"pending", placeName:null, accuracy:null, lastDataFetch:null,
  weather:null, weatherStatus:"loading",
  shelters:{ shelter:null, water:null, supply:null, food:null },

const t = k => (T[S.lang] && T[S.lang][k]) || T.ja[k] || k;
const $ = s => document.querySelector(s);

/* ---------------- real-data helpers ---------------- */
function haversineKm(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(s));
}
function fmtDist(km){
  return km < 1 ? Math.round(km*1000)+"m" : km.toFixed(1)+"km";
}
function weatherBucket(code, precip){
  if([95,96,99].includes(code)) return "wxStorm";
  if([71,73,75,77,85,86].includes(code)) return "wxSnow";
  if([45,48].includes(code)) return "wxFog";
  if([65,67,82].includes(code) || precip>=10) return "wxHeavy";
  if([51,53,55,56,57,61,63,66,80,81].includes(code)) return "wxRain";
  if([1,2,3].includes(code)) return "wxCloudy";
  return "wxClear";
}

const MOVE_RERENDER_KM = 0.1;   // reposition the map once you've moved ~100m
const MOVE_REFETCH_KM = 0.3;    // re-pull weather/shelters once you've moved ~300m
const DATA_MAX_AGE_MS = 5*60*1000; // otherwise, refresh data at most every 5 min
let _watchId = null;

function startLocationWatch(){
  if(!("geolocation" in navigator)){
    S.coords = TOKYO_FALLBACK; S.locStatus = "unavailable"; render(); afterDataChange();
    return;
  }
  if(_watchId!=null) navigator.geolocation.clearWatch(_watchId);
  _watchId = navigator.geolocation.watchPosition(handlePosition, handlePositionError, {
    enableHighAccuracy:true, timeout:10000, maximumAge:0,
  });
}

function handlePosition(pos, opts={}){
  const prev = S.coords;
  const next = { lat:pos.coords.latitude, lon:pos.coords.longitude };
  const movedKm = prev ? haversineKm(prev, next) : Infinity;
  S.coords = next;
  S.accuracy = Math.round(pos.coords.accuracy);
  const firstFix = S.locStatus !== "granted";
  S.locStatus = "granted";
  const dataStale = !S.lastDataFetch || (Date.now()-S.lastDataFetch) > DATA_MAX_AGE_MS;
  const dueForData = opts.force || firstFix || movedKm > MOVE_REFETCH_KM || dataStale;
  const dueForRender = opts.force || firstFix || movedKm > MOVE_RERENDER_KM || dueForData;
  if(dueForRender) render();
  if(dueForData){
    S.lastDataFetch = Date.now();
    afterDataChange();
    reverseGeocode(next);
  }
}

function handlePositionError(){
  if(S.locStatus !== "granted"){ // don't clobber a fix we already have with a transient error
    S.coords = TOKYO_FALLBACK; S.locStatus = "denied"; render(); afterDataChange();
  }
}

function refreshLocationNow(){
  toast(t("locating"));
  navigator.geolocation.getCurrentPosition(
    pos=>handlePosition(pos, {force:true}),
    ()=>toast(t("locDenied")),
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}

async function reverseGeocode(coords){
  try{
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${coords.lat}&lon=${coords.lon}&zoom=14&accept-language=${S.lang==="en"?"en":"ja"}`;
    const res = await fetch(url, { headers:{ "Accept":"application/json" } });
    const data = await res.json();
    const a = data.address || {};
    S.placeName = a.suburb || a.town || a.city || a.city_district || a.county || data.display_name || null;
    render();
  }catch(e){ /* offline or blocked — silently keep placeName null */ }
}

async function fetchWeather(){
  if(!S.coords) return;
  S.weatherStatus = "loading";
  try{
    const { lat, lon } = S.coords;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code,wind_speed_10m&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    const c = data.current;
    S.weather = {
      tempC: Math.round(c.temperature_2m), code: c.weather_code,
      precip: c.precipitation, windKph: Math.round(c.wind_speed_10m),
      fetchedAt: Date.now(),
    };
    S.weatherStatus = "ok";
    localStorage.setItem("sonaeru_weather_cache", JSON.stringify(S.weather));
    if(!S.userToggled){
      const bucket = weatherBucket(S.weather.code, S.weather.precip);
      S.phase = (bucket==="wxHeavy" || bucket==="wxStorm") ? "hassai" : "heiji";
    }
  }catch(e){
    const cached = localStorage.getItem("sonaeru_weather_cache");
    if(cached){ S.weather = JSON.parse(cached); S.weatherStatus = "stale"; }
    else S.weatherStatus = "error";
  }
  render();
}

const OVERPASS_TAGS = {
  shelter: [["amenity","shelter"],["emergency","assembly_point"],["amenity","community_centre"],["amenity","school"]],
  water:   [["amenity","drinking_water"]],
  supply:  [["shop","convenience"],["shop","supermarket"]],
  food:    [["amenity","fast_food"],["amenity","restaurant"]],
};
const OVERPASS_ENDPOINTS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];

async function fetchNearby(cat){
  if(!S.coords) return;
  S.shelters[cat] = { status:"loading", items:[] };
  render();
  const tags = OVERPASS_TAGS[cat];
  const { lat, lon } = S.coords;
  for(const radius of [3000, 10000]){
    const clauses = tags.map(([k,v])=>`nwr["${k}"="${v}"](around:${radius},${lat},${lon});`).join("");
    const query = `[out:json][timeout:15];(${clauses});out center 15;`;
    let found = null;
    for(const endpoint of OVERPASS_ENDPOINTS){
      try{
        const ctrl = new AbortController();
        const timer = setTimeout(()=>ctrl.abort(), 12000);
        const res = await fetch(endpoint, { method:"POST", body:"data="+encodeURIComponent(query), signal:ctrl.signal });
        clearTimeout(timer);
        if(!res.ok) continue;
        const data = await res.json();
        found = data.elements || [];
        break;
      }catch(e){ /* try next endpoint */ }
    }
    if(found && found.length){
      const items = found.map(el=>{
        const p = el.type==="node" ? { lat:el.lat, lon:el.lon } : (el.center || null);
        if(!p) return null;
        return { name: el.tags?.name || t(cat), lat:p.lat, lon:p.lon, distKm: haversineKm(S.coords, p) };
      }).filter(Boolean).sort((a,b)=>a.distKm-b.distKm).slice(0,5);
      S.shelters[cat] = { status: items.length ? "ok" : "empty", items };
      render();
      return;
    }
  }
  S.shelters[cat] = { status:"empty", items:[] };
  render();
}
function ensureNearby(cat){
  const s = S.shelters[cat];
  if(!s || (s.status!=="ok" && s.status!=="loading" && s.status!=="empty")) fetchNearby(cat);
}

function afterDataChange(){
  fetchWeather();
  ensureNearby("shelter");
}

let _map = null;
function mountMap(containerId, points){
  const el = document.getElementById(containerId);
  if(!el || typeof L==="undefined" || !S.coords){
    if(_map){ _map.remove(); _map = null; }
    return;
  }
  if(_map){ _map.remove(); _map = null; }
  _map = L.map(containerId, { zoomControl:false, attributionControl:false }).setView([S.coords.lat, S.coords.lon], 14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19 }).addTo(_map);
  if(S.accuracy){
    L.circle([S.coords.lat, S.coords.lon], { radius:S.accuracy, color:"#1C7293", weight:1, fillOpacity:0.12 }).addTo(_map);
  }
  L.marker([S.coords.lat, S.coords.lon]).addTo(_map).bindPopup(t("home"));
  points.forEach(p=>L.marker([p.lat, p.lon]).addTo(_map).bindPopup(p.name));
}

  }
  if(S.weatherStatus==="error" && !S.weather){
    return `<p class="sub" style="margin-top:6px">${t("weatherOffline")}</p>`;
  }
  const w = S.weather;
  const cond = t(weatherBucket(w.code, w.precip));

      <a class="listitem linkrow" style="color:inherit" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">
        <div class="icoc" style="background:var(--accent)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
        <div class="grow"><b style="font-size:13.5px">${p.name}</b><div class="qty">${t("dist")} ${fmtDist(p.distKm)}</div></div>
        <span class="badge blue">${t("openMaps")}</span>
      </a>`).join("");
  }
  return `
  <div class="card soft"><div class="row">
    <div class="icoc" style="background:var(--p3)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg></div>
    <p class="sub grow" style="color:#2E6FA0;font-weight:700">${t("langInfo")}</p></div>
  </div>
  <div class="chips">
    ${chip("shelter",t("shelter"))}${chip("water",t("water"))}${chip("supply",t("supply"))}${chip("food",t("food"))}
  </div>
  <div class="map tall" id="recoverMap"></div>
  <div class="card" style="margin-top:12px">
    ${catNote ? `<p class="note">${catNote}</p>` : ""}
    ${list}
  </div>
  <div class="card">
    <div class="row"><div class="grow"><h3>${t("safeReg")}</h3><p class="sub">${t("safeRegOK")}</p></div>
      <span class="badge ok">✓</span></div>
  </div>`;
}

/* ---------------- render ---------------- */
let _lastTab = null;
function render(){
  setPhaseTokens();
  app.dataset.phase = S.phase;
  // banner
  $("#bTitle").textContent = S.phase==="hassai" ? t("hassai_t") : t("heiji_t");
  $("#bSub").textContent   = S.phase==="hassai" ? t("hassai_s") : t("heiji_s");
  // nav labels + active
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.textContent = t("nav_"+el.dataset.nav);
  });
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle("on", b.dataset.t===S.tab));
  // lang pills
  document.querySelectorAll('#langpills button').forEach(b=>b.classList.toggle("on", b.dataset.l===S.lang));
  // demo btn
  $("#demoBtn").textContent = S.phase==="hassai" ? t("demoStop") : t("demoStart");
  // screen
  const scr = { home:screenHome, prepare:screenPrepare, protect:screenProtect, recover:screenRecover }[S.tab];
  $("#screen").innerHTML = scr();
  if(_lastTab !== S.tab){ $("#screen").scrollTop = 0; _lastTab = S.tab; }
  // live map (mounted after innerHTML so the container elements exist)
  if(S.tab==="protect"){
    const sh = S.shelters.shelter;
    mountMap("protectMap", sh && sh.status==="ok" ? sh.items.slice(0,1) : []);
  } else if(S.tab==="recover"){
    const cat = S.shelters[S.recTab];
    mountMap("recoverMap", cat && cat.status==="ok" ? cat.items : []);
  } else if(_map){
    _map.remove(); _map = null;
  }
}

/* ---------------- actions ---------------- */
function go(tab){ S.tab=tab; render(); }
function setRec(k){ S.recTab=k; render(); }
function restock(){ S.points+=5; toast("+5 "+t("pointsUnit")); render(); }
function answerQuiz(ok){ if(ok){ S.points+=10; S.quizDone=true; toast(t("quizCorrect")); render(); } else { toast(t("quizWrong")); } }
function toggleCheck(key){ S.checklist[key] = !S.checklist[key]; }
function toggleDemo(){
  S.userToggled = true;
  S.phase = S.phase==="hassai" ? "heiji" : "hassai";
  if(S.phase==="hassai") S.tab="home";
  render();
}

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
document.querySelectorAll('#langpills button').forEach(b=>b.onclick=()=>{ S.lang=b.dataset.l; document.documentElement.lang=b.dataset.l; render(); });
$("#demoBtn").onclick = toggleDemo;

render();
startLocationWatch();
setInterval(fetchWeather, 5*60*1000);

// offline support (works only when served over http/https, not file://)
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
